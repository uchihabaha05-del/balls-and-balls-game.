<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090b18">
<meta name="description" content="TRAPTAG — build it. trap it. beat it. Создавай 3D-уровни и проходи ловушки.">
<link rel="manifest" href="./manifest.webmanifest">
<title>TRAPTAG — Build it. Trap it. Beat it.</title>
<style>
:root{color-scheme:dark;--bg:#090b18;--panel:#14182b;--line:#303958;--muted:#a1aac8;--red:#ff465e;--cyan:#59e1ff;--violet:#9d7bff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f6f7ff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#app{height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:10px;max-width:1100px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:1000;font-size:clamp(23px,5vw,34px);letter-spacing:-1.5px}.brand span{color:var(--red)}.tagline{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:800}.top-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid var(--line);background:#1a2037;color:#fff;border-radius:11px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer;touch-action:manipulation}button:active{transform:scale(.97)}button.primary{background:linear-gradient(135deg,#ff5367,#c62e50);border-color:#ff6a7b}button.active{border-color:var(--cyan);box-shadow:0 0 0 1px #59e1ff66 inset;color:var(--cyan)}button:disabled{opacity:.35}
#toolbar{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}#toolbar .group{display:flex;gap:5px;flex-shrink:0}#toolbar .sep{height:28px;border-left:1px solid var(--line);margin:0 3px}
#viewport{position:relative;min-height:0;border:1px solid #303958;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 15%,#202746,#090b18 70%);box-shadow:0 16px 45px #0007}
#game{width:100%;height:100%;display:block;touch-action:none}
#hint{position:absolute;left:12px;top:10px;padding:8px 10px;border:1px solid #ffffff18;border-radius:10px;background:#090b18bb;color:#dce3ff;font-size:11px;pointer-events:none;max-width:75%}
#status{position:absolute;right:12px;top:10px;padding:8px 10px;border-radius:10px;background:#090b18bb;color:var(--cyan);font-size:11px;font-weight:900;pointer-events:none}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#171d34ee;border:1px solid #52618c;border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}#toast.show{opacity:1}
#play-controls{display:none;position:absolute;inset:auto 12px 12px;justify-content:space-between;align-items:end;pointer-events:none}#play-controls.visible{display:flex}.pad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,42px);gap:5px;pointer-events:auto}.pad button,.jump{background:#11182dcc;border:1px solid #8ba0d8aa;font-size:18px;padding:0;backdrop-filter:blur(8px);touch-action:none}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}.jump{width:68px;height:68px;border-radius:50%;font-size:12px;color:#fff;background:#d63252cc}
footer{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:10px}footer strong{color:#dfe5ff}
@media(min-width:760px){#app{padding:14px;gap:10px}button{font-size:13px;padding:10px 14px}#toolbar{flex-wrap:wrap;overflow:visible}#hint{font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body><main id="app">
<header><div><div class="brand">TRAP<span>TAG</span></div><div class="tagline">BUILD IT. TRAP IT. BEAT IT.</div></div><div class="top-actions"><button id="save">💾 Сохранить</button><button id="load">↶ Загрузить</button><button id="export">⇩ Экспорт</button></div></header>
<nav id="toolbar">
<div class="group"><button id="buildMode" class="active">▦ ПЛАТФОРМЫ</button><button id="trapMode">⚠ ЛОВУШКИ</button><button id="testMode" class="primary">▶ ТЕСТ</button></div><div class="sep"></div>
<div class="group" id="palette"><button data-tool="platform" class="active">▰ Блок</button><button data-tool="spikes">▲ Шипы</button><button data-tool="saw">✹ Пила</button><button data-tool="laser">╱ Лазер</button><button data-tool="erase">⌫ Удалить</button></div><div class="sep"></div>
<div class="group"><button id="rotate">⟳ Поворот</button><button id="clear">✕ Очистить</button></div>
</nav>
<section id="viewport"><canvas id="game"></canvas><div id="hint">Построй трассу: нажми на сетку, чтобы добавить платформы. Перетаскивай камеру двумя пальцами.</div><div id="status">РЕДАКТОР · 0 ОБЪЕКТОВ</div><div id="toast"></div>
<div id="play-controls"><div class="pad"><button class="up" data-key="forward">▲</button><button class="left" data-key="left">◀</button><button class="down" data-key="back">▼</button><button class="right" data-key="right">▶</button></div><button class="jump" data-key="jump">ПРЫЖОК</button></div>
</section>
<footer><span><strong>TRAPTAG prototype</strong> · 3D level builder</span><span>Локальное сохранение · Без аккаунта</span></footer>
</main><script type="module" src="./game.js"></script><script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
